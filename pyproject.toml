[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agile-po-agent"
version = "0.1.0"
description = "An evidence-gated AutoGen product owner agent that drafts excellent Jira work items."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Agile PO Agent contributors" }]
keywords = ["agile", "autogen", "jira", "product-owner", "jev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "autogen-agentchat==0.7.5",
  "autogen-ext[openai]==0.7.5",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
agile-po = "agile_po_agent.cli:app"

[project.urls]
Documentation = "https://github.com/kudretocom/agile-po-agent#readme"
Issues = "https://github.com/kudretocom/agile-po-agent/issues"
Source = "https://github.com/kudretocom/agile-po-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/agile_po_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agile_po_agent"]

